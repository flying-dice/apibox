name: Refresh release artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-artifacts
  cancel-in-progress: false

jobs:
  refresh:
    name: Build and commit distributable assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Build distributable code and viewer
        run: bun run build

      - name: Refresh prebuilt viewer
        run: bun run sync-viewer

      - name: Commit changed artifacts
        run: |
          git add -f packages/cli/dist packages/cli/assets/viewer
          if git diff --cached --quiet; then
            echo "Release artifacts are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh release artifacts [skip ci]"
          git push

name: Deploy APIBox documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build browser viewer
        run: bun run --cwd packages/viewer build:web

      - name: Sync browser viewer
        run: bun run sync-viewer

      - name: Build API documentation
        run: >-
          bun run dev:cli -- build
          examples/petstore.yaml
          examples/streetlights.asyncapi.yaml
          examples/wallet.openrpc.json
          --out ./site
          --title "APIBox examples"
          --base ./

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

asyncapi: 3.0.0
id: 'urn:example:com:streetlights'
x-internal-build: nightly
info:
  x-support-channel: '#streetlights'
  title: Streetlights
  version: 1.0.0
  description: |
    A small event-driven API for a city's smart streetlights. Lights publish
    telemetry; the city sends them commands.
  termsOfService: https://example.com/terms
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  externalDocs:
    description: Streetlights API guide
    url: https://example.com/docs/streetlights
  tags:
    - name: telemetry
      description: Readings published by a light.
      externalDocs:
        url: https://example.com/docs/telemetry
    - name: control
      description: Commands sent to a light.
defaultContentType: application/json
servers:
  mosquitto:
    host: test.mosquitto.org
    protocol: mqtt
    protocolVersion: '3.1.1'
    pathname: /mqtt
    description: Public test broker.
    tags:
      - name: primary
    x-internal-note: primary broker
    variables:
      port:
        default: '1883'
        description: Broker port. Use 8883 for TLS.
        enum: ['1883', '8883']
    security:
      - $ref: '#/components/securitySchemes/apiToken'
    bindings:
      mqtt:
        clientId: streetlights-server
        cleanSession: true
        keepAlive: 60
        bindingVersion: 0.2.0
channels:
  lightMeasured:
    address: 'smartylighting/streetlights/1/0/event/{streetlightId}/lighting/measured'
    title: Light measured
    description: Telemetry published whenever a light takes a reading.
    tags:
      - name: telemetry
    externalDocs:
      url: https://example.com/docs/light-measured-channel
      description: Light measured channel reference
    x-channel-note: primary telemetry channel
    parameters:
      streetlightId:
        description: The identifier of the streetlight.
    messages:
      lightMeasured:
        $ref: '#/components/messages/LightMeasured'
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0
  turnOn:
    address: 'smartylighting/streetlights/1/0/action/{streetlightId}/turn/on'
    title: Turn on
    description: Command a streetlight to switch on.
    parameters:
      streetlightId:
        description: The identifier of the streetlight.
    messages:
      turnOn:
        $ref: '#/components/messages/TurnOnOff'
  dimLight:
    address: 'smartylighting/streetlights/1/0/action/{streetlightId}/dim'
    title: Dim light
    description: Request a streetlight to dim, expecting an acknowledgement in reply.
    parameters:
      streetlightId:
        description: The identifier of the streetlight.
    messages:
      dimLight:
        $ref: '#/components/messages/DimLight'
  dimLightAck:
    address: 'smartylighting/streetlights/1/0/action/{streetlightId}/dim/ack'
    title: Dim light acknowledged
    description: Confirms a dimming request was applied.
    messages:
      dimLightAck:
        $ref: '#/components/messages/DimLightAck'
  faultReported:
    address: 'smartylighting/streetlights/1/0/event/{streetlightId}/fault'
    title: Fault reported
    description: >
      Documented ahead of an operation being wired to it -- a light will eventually publish
      here, but no publish/subscribe operation references it yet.
    tags:
      - name: diagnostics
    externalDocs:
      url: https://example.com/docs/faults
      description: Fault codes reference
    x-channel-note: legacy channel
    parameters:
      streetlightId:
        description: The identifier of the streetlight.
        location: '$message.payload#/streetlightId'
operations:
  receiveLightMeasurement:
    action: receive
    channel: { $ref: '#/channels/lightMeasured' }
    summary: Receive a lighting measurement.
    tags:
      - name: telemetry
    bindings:
      mqtt:
        qos: 1
        bindingVersion: 0.2.0
  sendTurnOn:
    action: send
    channel: { $ref: '#/channels/turnOn' }
    summary: Turn a streetlight on.
    tags:
      - name: control
    security:
      - $ref: '#/components/securitySchemes/apiToken'
  sendDimLight:
    action: send
    channel: { $ref: '#/channels/dimLight' }
    summary: Request a streetlight to dim.
    tags:
      - name: control
    reply:
      address:
        location: '$message.header#/correlationId'
        description: Matches the acknowledgement to the original dimming request.
      channel: { $ref: '#/channels/dimLightAck' }
      messages:
        - $ref: '#/components/messages/DimLightAck'
components:
  securitySchemes:
    apiToken:
      type: httpApiKey
      name: X-Api-Token
      in: header
      description: A static per-city API token.
  messages:
    LightMeasured:
      name: lightMeasured
      title: Light measured
      summary: Reports the current luminosity of a streetlight.
      contentType: application/json
      tags:
        - name: telemetry
      externalDocs:
        url: https://example.com/docs/light-measured
        description: Light measured message reference
      correlationId:
        location: '$message.header#/correlationId'
        description: Correlates a reading with the request that triggered it, when polled.
      bindings:
        mqtt:
          payloadFormatIndicator: 1
          bindingVersion: 0.2.0
      x-message-note: authored on the message
      payload:
        type: object
        required: [lumens, sentAt]
        properties:
          lumens: { type: integer, minimum: 0, description: Current luminosity., examples: [900] }
          sentAt: { type: string, format: date-time, description: When the reading was taken. }
      examples:
        - name: Bright afternoon
          summary: A typical daytime reading.
          payload:
            lumens: 900
            sentAt: '2024-06-01T14:00:00Z'
    TurnOnOff:
      name: turnOnOff
      title: Turn on or off
      summary: Command a streetlight to change state.
      contentType: application/json
      payload:
        type: object
        required: [command]
        properties:
          command:
            type: string
            enum: [on, off]
            description: Whether to turn the light on or off.
          sentAt: { type: string, format: date-time }
    DimLight:
      name: dimLight
      title: Dim light
      summary: Request a streetlight to dim to a given level.
      contentType: application/json
      payload:
        type: object
        required: [level]
        properties:
          level: { type: integer, minimum: 0, maximum: 100, description: Target brightness percentage. }
    DimLightAck:
      name: dimLightAck
      title: Dim light acknowledged
      summary: Confirms the dimming level that was applied.
      contentType: application/json
      payload:
        type: object
        required: [level]
        properties:
          level: { type: integer, minimum: 0, maximum: 100 }

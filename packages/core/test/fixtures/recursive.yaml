openapi: 3.1.0
info: { title: Tree, version: 1.0.0 }
paths:
  /tree:
    get:
      operationId: getTree
      responses:
        '200':
          description: A tree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
components:
  schemas:
    Node:
      type: object
      required: [id]
      properties:
        id: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/Node' }
        sibling: { $ref: '#/components/schemas/Node' }
